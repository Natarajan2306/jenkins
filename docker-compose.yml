services:
  gmail-jenkins-webhook:
    build: .
    container_name: gmail-jenkins-webhook
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - JENKINS_URL=${JENKINS_URL}
      - JENKINS_USER=${JENKINS_USER}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN}
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - JENKINS_TIMEOUT=${JENKINS_TIMEOUT:-60}
    volumes:
      # Optional: Mount logs directory
      - ./logs:/app/logs
    networks:
      - webhook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  webhook-network:
    driver: bridge